<!doctype html>
<meta charset="utf-8">
<title>sam-devkit</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.25rem; }
  nav { margin: 1rem 0 .5rem; display: flex; gap: .5rem; }
  nav button { cursor: pointer; padding: .4rem .8rem; }
  label { display: block; margin: .5rem 0 .2rem; font-weight: 600; }
  input { width: 100%; padding: .4rem; box-sizing: border-box; }
  button { margin-top: 1rem; padding: .5rem 1rem; cursor: pointer; }
  pre { background: #111; color: #0f0; padding: 1rem; min-height: 8rem; white-space: pre-wrap; overflow-x: auto; }
  .ok { color: #0a0; } .err { color: #c00; }
</style>
<h1>sam-devkit</h1>
<label>Environment</label>
<select id="env"></select>
<label>API base URL</label>
<input id="apiBaseUrl" placeholder="http://localhost:5000" readonly>
<nav>
  <button data-tab="approve">Approve-through</button>
  <button data-tab="clone">Clone → approve</button>
  <button data-tab="create">Create → approve</button>
  <button data-tab="sapfix">SAP fixup</button>
</nav>
<section id="tab-approve">
  <label>Proposal ID (Pending)</label>
  <input id="proposalId" placeholder="guid">
  <button id="run">Run approve-through</button>
</section>
<section id="tab-clone" hidden>
  <label>Source RequestNo</label><input id="cl-requestNo">
  <label>Source Version</label><input id="cl-version" type="number">
  <label>SalesOrgId</label><input id="cl-salesOrgId">
  <label>ProposalGroupId (P=1,R=2,S=3)</label><input id="cl-groupId" type="number">
  <label>CustomerGroupId</label><input id="cl-cg">
  <label>Month</label><input id="cl-month" type="number">
  <label>Year</label><input id="cl-year" type="number">
  <label><input type="checkbox" id="cl-e2e" checked> Then run approve-through</label>
  <label>Submit as</label>
  <select id="cl-submitAs">
    <option value="srp">srp — full 4-step chain (needs srp.ReportToId = sam)</option>
    <option value="sam">sam — auto-bypass ASM, chain starts at sdm</option>
  </select>
  <button id="cl-run">Run clone</button>
</section>
<section id="tab-create" hidden>
  <label>Type (R/S/P)</label><input id="cr-type" value="R">
  <label>SalesOrgId</label><input id="cr-salesOrgId">
  <label>CustomerGroupId</label><input id="cr-cg">
  <label>Product IDs (comma-separated)</label><input id="cr-products">
  <label>Month</label><input id="cr-month" type="number">
  <label>Year</label><input id="cr-year" type="number">
  <label>Raw rebatePayload JSON (optional — overrides template)</label><input id="cr-raw">
  <label><input type="checkbox" id="cr-e2e" checked> Then run approve-through</label>
  <label>Submit as</label>
  <select id="cr-submitAs">
    <option value="srp">srp — full 4-step chain (needs srp.ReportToId = sam)</option>
    <option value="sam">sam — auto-bypass ASM, chain starts at sdm</option>
  </select>
  <button id="cr-run">Run create</button>
</section>
<section id="tab-sapfix" hidden>
  <label>Proposal ID (guid)</label><input id="sf-proposalId">
  <label>SAP status</label>
  <select id="sf-status">
    <option value="__leave__">— leave unchanged —</option>
    <option value="success">success</option>
    <option value="fail">fail</option>
    <option value="">(clear)</option>
  </select>
  <label>Contract number (optional)</label>
  <input id="sf-contractNo">
  <button id="sf-random" type="button">🎲 Random (11 digits)</button>
  <button id="sf-run">Run SAP fixup</button>
</section>
<pre id="log"></pre>
<script>
  const $ = (id) => document.getElementById(id);
  const envUrls = {};
  fetch('/config').then((r) => r.json()).then((c) => {
    const sel = $('env');
    sel.innerHTML = '';
    for (const e of c.environments || []) {
      envUrls[e.name] = e.apiBaseUrl;
      const opt = document.createElement('option');
      opt.value = e.name;
      opt.textContent = e.name;
      sel.appendChild(opt);
    }
    sel.value = c.defaultEnv;
    $('apiBaseUrl').value = envUrls[sel.value] || '';
  });
  $('env').onchange = () => { $('apiBaseUrl').value = envUrls[$('env').value] || ''; };

  function show(tab) {
    for (const s of ['approve', 'clone', 'create', 'sapfix']) $('tab-' + s).hidden = (s !== tab);
  }
  document.querySelectorAll('nav button').forEach((b) => { b.onclick = () => show(b.dataset.tab); });
  show('approve');

  async function stream(body) {
    const logEl = $('log'); logEl.textContent = '';
    const res = await fetch('/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const reader = res.body.getReader(); const dec = new TextDecoder();
    for (;;) { const { value, done } = await reader.read(); if (done) break; logEl.textContent += dec.decode(value, { stream: true }); logEl.scrollTop = logEl.scrollHeight; }
  }

  $('run').onclick = () => stream({ module: 'approve', env: $('env').value, proposalId: $('proposalId').value });

  $('cl-run').onclick = () => stream({
    module: $('cl-e2e').checked ? 'end-to-end-clone' : 'clone',
    env: $('env').value,
    submitAs: $('cl-submitAs').value,
    source: { requestNo: $('cl-requestNo').value, version: Number($('cl-version').value), salesOrgId: $('cl-salesOrgId').value, proposalGroupId: Number($('cl-groupId').value), customerGroupId: $('cl-cg').value },
    month: Number($('cl-month').value), year: Number($('cl-year').value),
  });

  $('cr-run').onclick = () => stream({
    module: $('cr-e2e').checked ? 'end-to-end-create' : 'create',
    env: $('env').value,
    submitAs: $('cr-submitAs').value,
    type: $('cr-type').value, salesOrgId: $('cr-salesOrgId').value, customerGroupId: $('cr-cg').value,
    productIds: $('cr-products').value.split(',').map((s) => s.trim()).filter(Boolean),
    month: Number($('cr-month').value), year: Number($('cr-year').value),
    rawPayload: $('cr-raw').value ? { rebatePayload: $('cr-raw').value } : undefined,
  });

  $('sf-random').onclick = () => {
    let s = '';
    for (let i = 0; i < 11; i++) s += Math.floor(Math.random() * 10);
    $('sf-contractNo').value = s;
  };

  $('sf-run').onclick = () => {
    const status = $('sf-status').value;
    const body = { module: 'sap-fixup', env: $('env').value, proposalId: $('sf-proposalId').value };
    if (status !== '__leave__') body.sapStatus = status;
    const cn = $('sf-contractNo').value.trim();
    if (cn) body.contractNo = cn;
    stream(body);
  };
</script>
